description: Not found (User not found)
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Route not found
        data:
          type: object
          description: Error object produced by http-errors (may contain name, message, details, etc.)
          additionalProperties: true
          example:
            name: NotFound
            message: 'Route not found'
